<?xml version="1.0" encoding="UTF-8"?>
<!--
  Dam Craft — Stacked Lockup + Tagline
  ──────────────────────────────────────
  Arch mark + "Dam Craft" wordmark + divider + tagline.
  Mark and wordmark: Forge #FF5300.
  Divider: Walnut #4A3530 at 35% opacity.
  Tagline: Pitch #1A0E08, DM Sans 400.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@800&amp;family=DM+Sans:wght@400&amp;display=swap');
    </style>
  </defs>

  <!-- Arch mark — centred at x=280, top-padded 40px -->
  <svg x="30" y="40" width="500" height="444" viewBox="0 0 504 450">
    <path fill="#FF5300" d="M123.28,370.98l27.33,79.02h-54.66l27.33-79.02ZM269.39,450h22.87l-22.87-55.24v55.24ZM408.88,450v-55.24l-22.75,55.24h22.75ZM260.7,0h-17.4C108.93,0,0,108.93,0,243.3v206.7h54.55l45.24-126h47.27l45.24,126h36.49v-126h46.11l53.9,126h20.97l53.9-126h45.82v126h54.52v-206.7C504,108.93,395.07,0,260.7,0Z"/>
  </svg>

  <!-- Wordmark -->
  <text
    x="280"
    y="500"
    text-anchor="middle"
    dominant-baseline="hanging"
    font-family="Raleway, sans-serif"
    font-weight="800"
    font-size="80"
    fill="#FF5300"
    letter-spacing="3">Dam Craft</text>

  <!-- Divider -->
  <line x1="110" y1="600" x2="450" y2="600" stroke="#4A3530" stroke-width="1" opacity=".35"/>

  <!-- Tagline -->
  <text
    x="280"
    y="616"
    text-anchor="middle"
    dominant-baseline="hanging"
    font-family="DM Sans, sans-serif"
    font-weight="400"
    font-size="21"
    fill="#1A0E08"
    letter-spacing="2">We don't decorate. We construct.</text>

</svg>
